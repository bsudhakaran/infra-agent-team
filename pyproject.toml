[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "infra-agent-team"
version = "0.1.0"
description = "Autonomous LangGraph agent team that generates, tests, deploys, costs and destroys cloud infrastructure with Terraform"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Sudhakaran" }]
dependencies = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "boto3>=1.34",
    "PyYAML>=6",
    "requests>=2.31",
]

[project.optional-dependencies]
anthropic = ["langchain-anthropic"]
openai = ["langchain-openai"]
ollama = ["langchain-ollama"]
gcp = ["google-auth"]
dev = ["pytest>=8"]

[project.scripts]
iat = "infra_agent_team.cli:main"

[tool.setuptools.packages.find]
include = ["infra_agent_team*"]

[tool.setuptools.package-data]
infra_agent_team = ["blueprints/**/*", "pricing/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
